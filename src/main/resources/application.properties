# =====================================================================================
# Nexora Hotel — configuración común a todos los perfiles.
# Secretos y parámetros de despliegue SOLO por variables de entorno (ver .env.example).
# En local, copia .env.example a .env (ignorado por git): se importa abajo.
# La configuración funcional del hotel (tema, políticas, tarifas, SMTP...) vive en PostgreSQL.
# =====================================================================================
spring.application.name=nexora-hotel-backend
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]

# ── DataSource ──────────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexora_hotel}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# ── JPA / Hibernate ─────────────────────────────────────────────────────────────────
# El esquema lo gobierna Flyway (db/migration). Hibernate solo verifica que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Servidor ────────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8090}
# Detrás de Coolify/Traefik: IP real del cliente desde X-Forwarded-For (rate limiting, auditoría).
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
# Margen sobre el límite de negocio por imagen (lo valida StorageService con mensaje legible).
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=40MB

# ── Jackson ─────────────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=false

# ── Actuator: solo salud, sin detalles ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── OpenAPI ─────────────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha

# ── Aplicación (AppProperties) ──────────────────────────────────────────────────────
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5180}
app.public-url=${APP_PUBLIC_URL:http://localhost:8090}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5180}

# Access token corto: autoriza cada request; se renueva con el refresh token (cookie httpOnly).
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-ttl=${APP_JWT_ACCESS_TTL:PT20M}
app.jwt.refresh-ttl=${APP_JWT_REFRESH_TTL:PT10H}
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAMESITE:Lax}

# AES-256-GCM para credenciales guardadas en BD (SMTP, pasarela, identificaciones).
app.encryption.key=${APP_ENCRYPTION_KEY:}

# Imágenes subidas: SIEMPRE fuera del artefacto desplegado (volumen persistente en prod).
app.storage.dir=${APP_STORAGE_DIR:./data/storage}
app.storage.max-image-bytes=${APP_STORAGE_MAX_IMAGE_BYTES:8388608}

logging.level.root=INFO
logging.level.com.nexora.hotel=INFO

# ── Protecciones de autenticación (pisos mínimos validados en AppProperties) ────────
app.security.rate-limit-enabled=${APP_RATE_LIMIT_ENABLED:true}
app.security.max-failed-logins=${APP_MAX_FAILED_LOGINS:5}
app.security.lock-duration=${APP_LOCK_DURATION:PT15M}
app.security.reset-token-ttl=${APP_RESET_TOKEN_TTL:PT30M}

# ── Alta inicial del SUPER_ADMIN (solo si todavía no existe ninguno) ────────────────
app.bootstrap.super-admin-email=${APP_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin-password=${APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
# Hotel de demostración con admin y recepcionista: SOLO perfil dev.
app.bootstrap.demo-data=${APP_DEMO_DATA:false}
app.bootstrap.demo-password=${APP_DEMO_PASSWORD:}

# ── Correo de plataforma (recuperación de contraseña) ──────────────────────────────
# Sin host: en dev el enlace se escribe en el log; en prod se registra una advertencia y no se envía.
# (No se usa spring.mail.*: con host vacío Spring crearía el cliente igual y el health check caería.)
# El SMTP propio de cada hotel (cifrado en BD) se configura en Configuración → Correo.
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:no-reply@nexora.mx}

# Pasarela de pagos (Openpay). Las credenciales son de cada hotel (Configuración → Pagos), aquí solo los endpoints.
app.payments.openpay-sandbox-url=${OPENPAY_SANDBOX_URL:https://sandbox-api.openpay.mx}
app.payments.openpay-production-url=${OPENPAY_PRODUCTION_URL:https://api.openpay.mx}
app.payments.timeout=${APP_PAYMENTS_TIMEOUT:PT20S}
